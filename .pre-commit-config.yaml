default_install_hook_types: [pre-commit, commit-msg, pre-push]
fail_fast: true

repos:
  - repo: local
    hooks:
      - id: prevent-protected-branch-push
        name: prevent direct pushes to main/master
        entry: python -m greek_tv.dev.protected_branch
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch
        args: [--branch, main, --branch, master]
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-ast
      - id: check-json
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.16.3
    hooks:
      - id: commitizen
        stages: [commit-msg]

  - repo: https://github.com/dbt-checkpoint/dbt-checkpoint
    rev: v2.0.10
    hooks:
      - id: dbt-parse
        entry: env DBT_DUCKDB_PATH=data/greek_tv.duckdb dbt-parse
        additional_dependencies: ["dbt-duckdb>=1.10,<1.11"]
        args:
          - --global-flags
          - ++log-path
          - dbt/logs
          - --cmd-flags
          - ++project-dir
          - dbt
          - ++profiles-dir
          - dbt
        stages: [pre-push]
      - id: dbt-compile
        entry: env DBT_DUCKDB_PATH=data/greek_tv.duckdb dbt-compile
        additional_dependencies: ["dbt-duckdb>=1.10,<1.11"]
        args:
          - --global-flags
          - ++log-path
          - dbt/logs
          - --cmd-flags
          - ++project-dir
          - dbt
          - ++profiles-dir
          - dbt
          - --
        stages: [pre-push]
      - id: dbt-docs-generate
        entry: env DBT_DUCKDB_PATH=data/greek_tv.duckdb dbt-docs-generate
        additional_dependencies: ["dbt-duckdb>=1.10,<1.11"]
        always_run: true
        pass_filenames: false
        args:
          - --global-flags
          - ++log-path
          - dbt/logs
          - --cmd-flags
          - ++no-compile
          - ++project-dir
          - dbt
          - ++profiles-dir
          - dbt
        stages: [pre-push]

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: pytest -q
        language: system
        pass_filenames: false
        stages: [pre-push]

version: 2

models:
  - name: raw_ingestion_runs
    description: "{{ doc('raw_ingestion_runs') }}"
    columns:
      - name: run_id
        description: "{{ doc('raw_ingestion_runs_run_id') }}"
        data_tests:
          - not_null
          - unique
      - name: source
        description: "{{ doc('raw_ingestion_runs_source') }}"
        data_tests:
          - not_null
      - name: channel
        description: "{{ doc('raw_ingestion_runs_channel') }}"
        data_tests:
          - not_null
      - name: schedule_date
        description: "{{ doc('raw_ingestion_runs_schedule_date') }}"
        data_tests:
          - not_null
      - name: source_url
        description: "{{ doc('raw_ingestion_runs_source_url') }}"
        data_tests:
          - not_null
      - name: started_at
        description: "{{ doc('raw_ingestion_runs_started_at') }}"
        data_tests:
          - not_null
      - name: completed_at
        description: "{{ doc('raw_ingestion_runs_completed_at') }}"
      - name: status
        description: "{{ doc('raw_ingestion_runs_status') }}"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [running, succeeded, failed]
      - name: records_parsed
        description: "{{ doc('raw_ingestion_runs_records_parsed') }}"
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: snapshot_path
        description: "{{ doc('raw_ingestion_runs_snapshot_path') }}"
      - name: error_message
        description: "{{ doc('raw_ingestion_runs_error_message') }}"

  - name: raw_broadcast_observations
    description: "{{ doc('raw_broadcast_observations') }}"
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "ends_at is null or ends_at > starts_at"
    columns:
      - name: observation_id
        description: "{{ doc('raw_broadcast_observations_observation_id') }}"
        data_tests:
          - not_null
          - unique
      - name: run_id
        description: "{{ doc('raw_broadcast_observations_run_id') }}"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('raw_ingestion_runs')
                field: run_id
      - name: broadcast_id
        description: "{{ doc('raw_broadcast_observations_broadcast_id') }}"
        data_tests:
          - not_null
      - name: channel
        description: "{{ doc('raw_broadcast_observations_channel') }}"
        data_tests:
          - not_null
      - name: title
        description: "{{ doc('raw_broadcast_observations_title') }}"
        data_tests:
          - not_null
          - dbt_utils.not_empty_string
      - name: starts_at
        description: "{{ doc('raw_broadcast_observations_starts_at') }}"
        data_tests:
          - not_null
      - name: ends_at
        description: "{{ doc('raw_broadcast_observations_ends_at') }}"
      - name: description
        description: "{{ doc('raw_broadcast_observations_description') }}"
      - name: source_url
        description: "{{ doc('raw_broadcast_observations_source_url') }}"
        data_tests:
          - not_null
      - name: retrieved_at
        description: "{{ doc('raw_broadcast_observations_retrieved_at') }}"
        data_tests:
          - not_null

  - name: raw_tmdb_searches
    description: "{{ doc('raw_tmdb_searches') }}"
    columns:
      - name: search_id
        description: "{{ doc('raw_tmdb_search_id') }}"
        data_tests: [not_null, unique]
      - name: normalized_title
        description: "{{ doc('raw_tmdb_normalized_title') }}"
        data_tests: [not_null, dbt_utils.not_empty_string]
      - name: search_query
        description: "{{ doc('raw_tmdb_search_query') }}"
        data_tests: [not_null, dbt_utils.not_empty_string]
      - name: language
        description: "{{ doc('raw_tmdb_language') }}"
        data_tests: [not_null, dbt_utils.not_empty_string]
      - name: retrieved_at
        description: "{{ doc('raw_tmdb_retrieved_at') }}"
        data_tests: [not_null]
      - name: response_json
        description: "{{ doc('raw_tmdb_response_json') }}"
        data_tests: [not_null]

  - name: raw_tmdb_lookup_contexts
    description: "{{ doc('raw_tmdb_lookup_contexts') }}"
    columns:
      - name: lookup_id
        description: "{{ doc('raw_tmdb_lookup_id') }}"
        data_tests: [not_null, unique]
      - name: source_title
        description: "{{ doc('raw_tmdb_source_title') }}"
        data_tests: [not_null, dbt_utils.not_empty_string]
      - name: normalized_source_title
        description: "{{ doc('raw_tmdb_normalized_source_title') }}"
        data_tests: [not_null, dbt_utils.not_empty_string]
      - name: production_year
        description: "{{ doc('raw_tmdb_production_year') }}"
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1900
                max_value: 2099
                row_condition: "production_year is not null"
      - name: query_titles_json
        description: "{{ doc('raw_tmdb_query_titles_json') }}"
        data_tests: [not_null]
      - name: used_query_override
        description: "{{ doc('raw_tmdb_used_query_override') }}"
        data_tests: [not_null]
      - name: search_id
        description: "{{ doc('raw_tmdb_search_id') }}"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('raw_tmdb_searches')
                field: search_id
      - name: created_at
        description: "{{ doc('raw_tmdb_created_at') }}"
        data_tests: [not_null]

  - name: raw_tmdb_candidates
    description: "{{ doc('raw_tmdb_candidates') }}"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [search_id, candidate_rank]
    columns:
      - name: search_id
        description: "{{ doc('raw_tmdb_search_id') }}"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('raw_tmdb_searches')
                field: search_id
      - name: candidate_rank
        description: "{{ doc('raw_tmdb_candidate_rank') }}"
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments: {min_value: 1}
      - name: tmdb_id
        description: "{{ doc('raw_tmdb_id') }}"
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments: {min_value: 1}
      - name: media_type
        description: "{{ doc('raw_tmdb_media_type') }}"
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: [movie, tv]}
      - name: title
        description: "{{ doc('raw_tmdb_title') }}"
        data_tests: [not_null, dbt_utils.not_empty_string]
      - name: original_title
        description: "{{ doc('raw_tmdb_original_title') }}"
        data_tests: [not_null, dbt_utils.not_empty_string]
      - name: original_language
        description: "{{ doc('raw_tmdb_original_language') }}"
      - name: release_date
        description: "{{ doc('raw_tmdb_release_date') }}"
      - name: overview
        description: "{{ doc('raw_tmdb_overview') }}"
      - name: popularity
        description: "{{ doc('raw_tmdb_popularity') }}"
      - name: vote_average
        description: "{{ doc('raw_tmdb_vote_average') }}"
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments: {min_value: 0, max_value: 10, row_condition: "vote_average is not null"}
      - name: vote_count
        description: "{{ doc('raw_tmdb_vote_count') }}"
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments: {min_value: 0, row_condition: "vote_count is not null"}

  - name: raw_tmdb_resolutions
    description: "{{ doc('raw_tmdb_resolutions') }}"
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "status != 'matched' or (tmdb_id is not null and media_type is not null)"
    columns:
      - name: resolution_id
        description: "{{ doc('raw_tmdb_resolution_id') }}"
        data_tests: [not_null, unique]
      - name: lookup_id
        description: "{{ doc('raw_tmdb_lookup_id') }}"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('raw_tmdb_lookup_contexts')
                field: lookup_id
      - name: scoring_version
        description: "{{ doc('raw_tmdb_scoring_version') }}"
        data_tests: [not_null, dbt_utils.not_empty_string]
      - name: status
        description: "{{ doc('raw_tmdb_resolution_status') }}"
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: [matched, unresolved]}
      - name: reason
        description: "{{ doc('raw_tmdb_resolution_reason') }}"
        data_tests: [not_null]
      - name: winning_candidate_rank
        description: "{{ doc('raw_tmdb_winning_candidate_rank') }}"
      - name: tmdb_id
        description: "{{ doc('raw_tmdb_accepted_id') }}"
      - name: media_type
        description: "{{ doc('raw_tmdb_accepted_media_type') }}"
        data_tests:
          - accepted_values:
              arguments: {values: [movie, tv], quote: true}
              config: {where: "media_type is not null"}
      - name: winning_score
        description: "{{ doc('raw_tmdb_winning_score') }}"
      - name: runner_up_score
        description: "{{ doc('raw_tmdb_runner_up_score') }}"
      - name: score_margin
        description: "{{ doc('raw_tmdb_score_margin') }}"
      - name: resolved_at
        description: "{{ doc('raw_tmdb_resolved_at') }}"
        data_tests: [not_null]

  - name: raw_tmdb_candidate_scores
    description: "{{ doc('raw_tmdb_candidate_scores') }}"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [resolution_id, candidate_rank]
    columns:
      - name: resolution_id
        description: "{{ doc('raw_tmdb_resolution_id') }}"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('raw_tmdb_resolutions')
                field: resolution_id
      - name: candidate_rank
        description: "{{ doc('raw_tmdb_candidate_rank') }}"
        data_tests: [not_null]
      - name: tmdb_id
        description: "{{ doc('raw_tmdb_id') }}"
        data_tests: [not_null]
      - name: title_score
        description: "{{ doc('raw_tmdb_title_score') }}"
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments: {min_value: 0, max_value: 100}
      - name: year_score
        description: "{{ doc('raw_tmdb_year_score') }}"
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments: {min_value: 0, max_value: 100, row_condition: "year_score is not null"}
      - name: total_score
        description: "{{ doc('raw_tmdb_total_score') }}"
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments: {min_value: 0, max_value: 100}
      - name: score_rank
        description: "{{ doc('raw_tmdb_score_rank') }}"
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments: {min_value: 1}

  - name: raw_tmdb_entity_details
    description: "{{ doc('raw_tmdb_entity_details') }}"
    columns:
      - name: entity_detail_id
        description: "{{ doc('raw_tmdb_entity_detail_id') }}"
        data_tests: [not_null, unique]
      - name: tmdb_id
        description: "{{ doc('raw_tmdb_id') }}"
        data_tests: [not_null]
      - name: media_type
        description: "{{ doc('raw_tmdb_media_type') }}"
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: [movie, tv]}
      - name: language
        description: "{{ doc('raw_tmdb_language') }}"
        data_tests: [not_null]
      - name: title
        description: "{{ doc('raw_tmdb_title') }}"
        data_tests: [not_null, dbt_utils.not_empty_string]
      - name: original_title
        description: "{{ doc('raw_tmdb_original_title') }}"
        data_tests: [not_null]
      - name: original_language
        description: "{{ doc('raw_tmdb_original_language') }}"
      - name: release_date
        description: "{{ doc('raw_tmdb_release_date') }}"
      - name: overview
        description: "{{ doc('raw_tmdb_overview') }}"
      - name: tagline
        description: "{{ doc('raw_tmdb_tagline') }}"
      - name: runtime_minutes
        description: "{{ doc('raw_tmdb_runtime_minutes') }}"
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments: {min_value: 0, row_condition: "runtime_minutes is not null"}
      - name: status
        description: "{{ doc('raw_tmdb_entity_status') }}"
      - name: homepage
        description: "{{ doc('raw_tmdb_homepage') }}"
      - name: imdb_id
        description: "{{ doc('raw_tmdb_imdb_id') }}"
      - name: poster_path
        description: "{{ doc('raw_tmdb_poster_path') }}"
      - name: genres_json
        description: "{{ doc('raw_tmdb_genres_json') }}"
        data_tests: [not_null]
      - name: production_countries_json
        description: "{{ doc('raw_tmdb_production_countries_json') }}"
        data_tests: [not_null]
      - name: production_companies_json
        description: "{{ doc('raw_tmdb_production_companies_json') }}"
        data_tests: [not_null]
      - name: spoken_languages_json
        description: "{{ doc('raw_tmdb_spoken_languages_json') }}"
        data_tests: [not_null]
      - name: retrieved_at
        description: "{{ doc('raw_tmdb_retrieved_at') }}"
        data_tests: [not_null]
      - name: response_json
        description: "{{ doc('raw_tmdb_response_json') }}"
        data_tests: [not_null]

  - name: raw_tmdb_entity_metric_observations
    description: "{{ doc('raw_tmdb_entity_metric_observations') }}"
    columns:
      - name: metric_observation_id
        description: "{{ doc('raw_tmdb_metric_observation_id') }}"
        data_tests: [not_null, unique]
      - name: entity_detail_id
        description: "{{ doc('raw_tmdb_entity_detail_id') }}"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('raw_tmdb_entity_details')
                field: entity_detail_id
      - name: tmdb_id
        description: "{{ doc('raw_tmdb_id') }}"
        data_tests: [not_null]
      - name: media_type
        description: "{{ doc('raw_tmdb_media_type') }}"
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: [movie, tv]}
      - name: popularity
        description: "{{ doc('raw_tmdb_popularity') }}"
      - name: vote_average
        description: "{{ doc('raw_tmdb_vote_average') }}"
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments: {min_value: 0, max_value: 10, row_condition: "vote_average is not null"}
      - name: vote_count
        description: "{{ doc('raw_tmdb_vote_count') }}"
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments: {min_value: 0, row_condition: "vote_count is not null"}
      - name: observed_at
        description: "{{ doc('raw_tmdb_observed_at') }}"
        data_tests: [not_null]

  - name: raw_broadcast_enrichment_lookups
    description: "{{ doc('raw_broadcast_enrichment_lookups') }}"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [observation_id, lookup_id, scoring_version]
    columns:
      - name: observation_id
        description: "{{ doc('raw_enrichment_observation_id') }}"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('raw_broadcast_observations')
                field: observation_id
      - name: lookup_id
        description: "{{ doc('raw_tmdb_lookup_id') }}"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('raw_tmdb_lookup_contexts')
                field: lookup_id
      - name: language
        description: "{{ doc('raw_tmdb_language') }}"
        data_tests: [not_null]
      - name: scoring_version
        description: "{{ doc('raw_tmdb_scoring_version') }}"
        data_tests: [not_null]
      - name: linked_at
        description: "{{ doc('raw_enrichment_linked_at') }}"
        data_tests: [not_null]

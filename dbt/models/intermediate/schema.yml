version: 2

models:
  - name: int_latest_successful_ingestion_runs
    description: "{{ doc('int_latest_successful_ingestion_runs') }}"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - source
              - channel
              - schedule_date
    columns:
      - name: run_id
        description: "{{ doc('int_latest_successful_ingestion_runs_run_id') }}"
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('raw_ingestion_runs')
                field: run_id
      - name: source
        description: "{{ doc('int_latest_successful_ingestion_runs_source') }}"
        data_tests:
          - not_null
      - name: channel
        description: "{{ doc('int_latest_successful_ingestion_runs_channel') }}"
        data_tests:
          - not_null
      - name: schedule_date
        description: "{{ doc('int_latest_successful_ingestion_runs_schedule_date') }}"
        data_tests:
          - not_null
      - name: source_url
        description: "{{ doc('int_latest_successful_ingestion_runs_source_url') }}"
        data_tests:
          - not_null
      - name: started_at
        description: "{{ doc('int_latest_successful_ingestion_runs_started_at') }}"
        data_tests:
          - not_null
      - name: completed_at
        description: "{{ doc('int_latest_successful_ingestion_runs_completed_at') }}"
        data_tests:
          - not_null
      - name: status
        description: "{{ doc('int_latest_successful_ingestion_runs_status') }}"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [succeeded]
      - name: records_parsed
        description: "{{ doc('int_latest_successful_ingestion_runs_records_parsed') }}"
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: snapshot_path
        description: "{{ doc('int_latest_successful_ingestion_runs_snapshot_path') }}"

  - name: int_current_broadcasts
    description: "{{ doc('int_current_broadcasts') }}"
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "ends_at is null or ends_at > starts_at"
    columns:
      - name: observation_id
        description: "{{ doc('int_current_broadcasts_observation_id') }}"
        data_tests:
          - not_null
          - unique
      - name: broadcast_id
        description: "{{ doc('int_current_broadcasts_broadcast_id') }}"
        data_tests:
          - not_null
      - name: run_id
        description: "{{ doc('int_current_broadcasts_run_id') }}"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_latest_successful_ingestion_runs')
                field: run_id
      - name: source
        description: "{{ doc('int_current_broadcasts_source') }}"
        data_tests:
          - not_null
      - name: channel
        description: "{{ doc('int_current_broadcasts_channel') }}"
        data_tests:
          - not_null
      - name: schedule_date
        description: "{{ doc('int_current_broadcasts_schedule_date') }}"
        data_tests:
          - not_null
      - name: title
        description: "{{ doc('int_current_broadcasts_title') }}"
        data_tests:
          - not_null
          - dbt_utils.not_empty_string
      - name: starts_at
        description: "{{ doc('int_current_broadcasts_starts_at') }}"
        data_tests:
          - not_null
      - name: ends_at
        description: "{{ doc('int_current_broadcasts_ends_at') }}"
      - name: description
        description: "{{ doc('int_current_broadcasts_description') }}"
      - name: source_url
        description: "{{ doc('int_current_broadcasts_source_url') }}"
        data_tests:
          - not_null
      - name: retrieved_at
        description: "{{ doc('int_current_broadcasts_retrieved_at') }}"
        data_tests:
          - not_null
      - name: ingestion_completed_at
        description: "{{ doc('int_current_broadcasts_ingestion_completed_at') }}"
        data_tests:
          - not_null

  - name: int_latest_tmdb_resolutions
    description: "{{ doc('int_latest_tmdb_resolutions') }}"
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "status != 'matched' or (tmdb_id is not null and media_type is not null)"
    columns:
      - name: resolution_id
        description: "{{ doc('int_tmdb_resolution_id') }}"
        data_tests: [not_null, unique]
      - name: lookup_id
        description: "{{ doc('int_tmdb_lookup_id') }}"
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('raw_tmdb_lookup_contexts')
                field: lookup_id
      - name: scoring_version
        description: "{{ doc('int_tmdb_scoring_version') }}"
        data_tests: [not_null]
      - name: status
        description: "{{ doc('int_tmdb_resolution_status') }}"
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: [matched, unresolved]}
      - name: reason
        description: "{{ doc('int_tmdb_resolution_reason') }}"
        data_tests: [not_null]
      - name: winning_candidate_rank
        description: "{{ doc('int_tmdb_winning_candidate_rank') }}"
      - name: tmdb_id
        description: "{{ doc('int_tmdb_id') }}"
      - name: media_type
        description: "{{ doc('int_tmdb_media_type') }}"
        data_tests:
          - accepted_values:
              arguments: {values: [movie, tv]}
              config: {where: "media_type is not null"}
      - name: winning_score
        description: "{{ doc('int_tmdb_winning_score') }}"
      - name: runner_up_score
        description: "{{ doc('int_tmdb_runner_up_score') }}"
      - name: score_margin
        description: "{{ doc('int_tmdb_score_margin') }}"
      - name: resolved_at
        description: "{{ doc('int_tmdb_resolved_at') }}"
        data_tests: [not_null]


version: 2

sources:
  - name: ingestion
    description: >-
      Immutable ingestion audit records and source observations written by the Python
      pipeline. dbt reads these relations but never mutates them.
    schema: main
    tables:
      - name: ingestion_runs
        description: One attempted schedule ingestion for a source, channel, and date.
        columns:
          - name: run_id
            description: Unique identifier assigned before ingestion work begins.
          - name: source
            description: Upstream schedule source identifier.
          - name: channel
            description: Channel display name observed during catalog discovery.
          - name: schedule_date
            description: Calendar date requested from the source.
          - name: source_url
            description: Date-addressable upstream schedule URL.
          - name: started_at
            description: UTC timestamp at which the run began.
          - name: completed_at
            description: UTC timestamp at which the run succeeded or failed.
          - name: status
            description: Current run state; running, succeeded, or failed.
          - name: records_parsed
            description: Number of observations atomically persisted by a successful run.
          - name: snapshot_path
            description: Local path to the immutable raw HTML response, when available.
          - name: error_message
            description: Bounded diagnostic message for a failed run.

      - name: broadcast_observations
        description: One programme row observed in one successful ingestion run.
        columns:
          - name: observation_id
            description: Stable identifier for a broadcast within an ingestion run.
          - name: run_id
            description: Ingestion run that produced this observation.
          - name: broadcast_id
            description: Source-observation identity derived from schedule attributes.
          - name: channel
            description: Channel display name associated with the programme.
          - name: title
            description: Programme title as observed in the source schedule.
          - name: starts_at
            description: Timezone-aware scheduled start timestamp.
          - name: ends_at
            description: Derived scheduled end timestamp, when another programme follows.
          - name: description
            description: Optional programme description supplied by the source.
          - name: source_url
            description: Upstream page from which the observation was parsed.
          - name: retrieved_at
            description: UTC timestamp at which the source response was retrieved.

  - name: enrichment
    description: >-
      Append-only external metadata searches, resolution evidence, and matched-entity
      details written by the Python enrichment pipeline. Search response order alone
      is never treated as an accepted entity match.
    schema: main
    tables:
      - name: tmdb_searches
        description: One cached raw TMDB response for a normalized title and language.
        columns:
          - name: search_id
            description: Unique identifier for one external API request.
          - name: normalized_title
            description: Canonical title used for exact cache lookup.
          - name: search_query
            description: Exact human-readable title sent to the TMDB API.
          - name: language
            description: TMDB response language requested by the client.
          - name: retrieved_at
            description: UTC timestamp at which the response was retrieved.
          - name: response_json
            description: Complete raw response retained for audit and reprocessing.

      - name: tmdb_lookup_contexts
        description: Source-title evidence linked to the TMDB search used for scoring.
        columns:
          - name: lookup_id
            description: Unique identifier for one source-title lookup attempt.
          - name: source_title
            description: Complete programme title preserved from the schedule.
          - name: normalized_source_title
            description: Canonical source-title identity used for comparison.
          - name: production_year
            description: Production year explicitly extracted from source text.
          - name: query_titles_json
            description: Ordered title variants explicitly found in the source.
          - name: used_query_override
            description: Whether a manually supplied query replaced automatic variants.
          - name: search_id
            description: Cached TMDB search selected for later candidate scoring.
          - name: created_at
            description: UTC timestamp at which the lookup context was recorded.

      - name: tmdb_candidates
        description: Supported movie and TV candidates parsed from one TMDB search.
        columns:
          - name: search_id
            description: TMDB search that returned the candidate.
          - name: candidate_rank
            description: Stable position among supported candidates in the response.
          - name: tmdb_id
            description: TMDB entity identifier, interpreted with media_type.
          - name: media_type
            description: Candidate entity type; movie or tv.
          - name: title
            description: Candidate display title in the requested response language.
          - name: original_title
            description: Candidate title in its original language.
          - name: original_language
            description: ISO language code supplied by TMDB when available.
          - name: release_date
            description: Movie release date or TV first-air date when available.
          - name: overview
            description: Candidate overview supplied by TMDB when available.
          - name: popularity
            description: TMDB popularity value at retrieval time.
          - name: vote_average
            description: TMDB average vote value at retrieval time.
          - name: vote_count
            description: TMDB vote count at retrieval time.

      - name: tmdb_resolutions
        description: Append-only conservative resolution outcomes for source lookups.
        columns:
          - name: resolution_id
            description: Unique identifier for one scoring execution.
          - name: lookup_id
            description: Source-evidence lookup evaluated by this execution.
          - name: scoring_version
            description: Version of the deterministic scoring policy.
          - name: status
            description: Final outcome; matched or unresolved.
          - name: reason
            description: Machine-readable explanation for the outcome.
          - name: winning_candidate_rank
            description: API response rank of the highest-scoring candidate.
          - name: tmdb_id
            description: Accepted TMDB identifier; null for every unresolved outcome.
          - name: media_type
            description: Accepted TMDB media type; null for every unresolved outcome.
          - name: winning_score
            description: Total score of the highest-ranked candidate.
          - name: runner_up_score
            description: Total score of the second-ranked candidate when available.
          - name: score_margin
            description: Difference between winner and runner-up total scores.
          - name: resolved_at
            description: UTC timestamp at which scoring was executed.

      - name: tmdb_candidate_scores
        description: Component-level score evidence for every evaluated candidate.
        columns:
          - name: resolution_id
            description: Resolution execution that produced the score.
          - name: candidate_rank
            description: Candidate position in the cached TMDB response.
          - name: tmdb_id
            description: TMDB identifier evaluated by the scoring policy.
          - name: title_score
            description: Title-similarity score from zero to one hundred.
          - name: year_score
            description: Production-year agreement score, null without source evidence.
          - name: total_score
            description: Weighted total confidence score from zero to one hundred.
          - name: score_rank
            description: Candidate rank after deterministic scoring.

      - name: tmdb_entity_details
        description: >-
          Immutable full metadata responses retrieved only for confidently matched
          movie and television identities.
        columns:
          - name: entity_detail_id
            description: Unique identifier for one entity-details retrieval.
          - name: tmdb_id
            description: Accepted TMDB entity identifier, interpreted with media_type.
          - name: media_type
            description: Accepted TMDB entity type; movie or tv.
          - name: language
            description: TMDB response language used for this cache entry.
          - name: title
            description: Localized entity title returned by TMDB.
          - name: original_title
            description: Entity title in its original language.
          - name: original_language
            description: ISO original-language code when supplied by TMDB.
          - name: release_date
            description: Movie release date or television first-air date.
          - name: overview
            description: Localized entity synopsis when available.
          - name: tagline
            description: Localized entity tagline when available.
          - name: runtime_minutes
            description: Movie runtime or first stated television episode runtime.
          - name: status
            description: TMDB production or release status.
          - name: homepage
            description: Official homepage supplied by TMDB when available.
          - name: imdb_id
            description: IMDb identity supplied directly by TMDB when available.
          - name: genres_json
            description: Ordered genre names serialized as JSON.
          - name: production_countries_json
            description: Ordered ISO production-country codes serialized as JSON.
          - name: production_companies_json
            description: Ordered production-company names serialized as JSON.
          - name: spoken_languages_json
            description: Ordered ISO spoken-language codes serialized as JSON.
          - name: retrieved_at
            description: UTC timestamp at which the details response was retrieved.
          - name: response_json
            description: Complete raw details response retained for audit and reprocessing.

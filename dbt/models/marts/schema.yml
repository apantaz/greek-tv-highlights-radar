version: 2

models:
  - name: dim_programmes
    description: "{{ doc('dim_programmes') }}"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [media_type, tmdb_id]
    columns:
      - name: programme_key
        description: "{{ doc('dim_programmes_programme_key') }}"
        data_tests: [not_null, unique]
      - name: entity_detail_id
        description: "{{ doc('dim_programmes_entity_detail_id') }}"
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('int_latest_tmdb_entity_details')
                field: entity_detail_id
      - name: tmdb_id
        description: "{{ doc('dim_programmes_tmdb_id') }}"
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
      - name: media_type
        description: "{{ doc('dim_programmes_media_type') }}"
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: [movie, tv]}
      - name: metadata_language
        description: "{{ doc('dim_programmes_metadata_language') }}"
        data_tests: [not_null]
      - name: title
        description: "{{ doc('dim_programmes_title') }}"
        data_tests:
          - not_null
          - dbt_utils.not_empty_string
      - name: original_title
        description: "{{ doc('dim_programmes_original_title') }}"
        data_tests:
          - not_null
          - dbt_utils.not_empty_string
      - name: original_language
        description: "{{ doc('dim_programmes_original_language') }}"
      - name: release_date
        description: "{{ doc('dim_programmes_release_date') }}"
      - name: release_year
        description: "{{ doc('dim_programmes_release_year') }}"
      - name: overview
        description: "{{ doc('dim_programmes_overview') }}"
      - name: tagline
        description: "{{ doc('dim_programmes_tagline') }}"
      - name: runtime_minutes
        description: "{{ doc('dim_programmes_runtime_minutes') }}"
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                row_condition: runtime_minutes is not null
      - name: status
        description: "{{ doc('dim_programmes_status') }}"
      - name: homepage
        description: "{{ doc('dim_programmes_homepage') }}"
      - name: imdb_id
        description: "{{ doc('dim_programmes_imdb_id') }}"
      - name: genres_json
        description: "{{ doc('dim_programmes_genres_json') }}"
        data_tests: [not_null]
      - name: production_countries_json
        description: "{{ doc('dim_programmes_production_countries_json') }}"
        data_tests: [not_null]
      - name: production_companies_json
        description: "{{ doc('dim_programmes_production_companies_json') }}"
        data_tests: [not_null]
      - name: spoken_languages_json
        description: "{{ doc('dim_programmes_spoken_languages_json') }}"
        data_tests: [not_null]
      - name: metadata_retrieved_at
        description: "{{ doc('dim_programmes_metadata_retrieved_at') }}"
        data_tests: [not_null]

  - name: dim_channels
    description: "{{ doc('dim_channels') }}"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [source, channel]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "latest_schedule_date >= first_schedule_date"
    columns:
      - name: channel_key
        description: "{{ doc('dim_channels_channel_key') }}"
        data_tests: [not_null, unique]
      - name: source
        description: "{{ doc('dim_channels_source') }}"
        data_tests: [not_null]
      - name: channel
        description: "{{ doc('dim_channels_channel') }}"
        data_tests: [not_null]
      - name: first_schedule_date
        description: "{{ doc('dim_channels_first_schedule_date') }}"
        data_tests: [not_null]
      - name: latest_schedule_date
        description: "{{ doc('dim_channels_latest_schedule_date') }}"
        data_tests: [not_null]
      - name: first_observed_at
        description: "{{ doc('dim_channels_first_observed_at') }}"
        data_tests: [not_null]
      - name: latest_observed_at
        description: "{{ doc('dim_channels_latest_observed_at') }}"
        data_tests: [not_null]

  - name: fct_current_broadcasts
    description: "{{ doc('fct_current_broadcasts') }}"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [source, channel, schedule_date, programme_position]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "duration_minutes is null or duration_minutes > 0"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "programme_key is null or resolution_status = 'matched'"
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('int_current_broadcasts')
    columns:
      - name: observation_id
        description: "{{ doc('fct_current_broadcasts_observation_id') }}"
        data_tests: [not_null, unique]
      - name: broadcast_id
        description: "{{ doc('fct_current_broadcasts_broadcast_id') }}"
        data_tests: [not_null]
      - name: run_id
        description: "{{ doc('fct_current_broadcasts_run_id') }}"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_latest_successful_ingestion_runs')
                field: run_id
      - name: channel_key
        description: "{{ doc('fct_current_broadcasts_channel_key') }}"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_channels')
                field: channel_key
      - name: programme_key
        description: "{{ doc('fct_current_broadcasts_programme_key') }}"
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_programmes')
                field: programme_key
      - name: lookup_id
        description: "{{ doc('fct_current_broadcasts_lookup_id') }}"
        data_tests:
          - relationships:
              arguments:
                to: ref('int_resolved_programmes')
                field: lookup_id
      - name: resolution_id
        description: "{{ doc('fct_current_broadcasts_resolution_id') }}"
        data_tests:
          - relationships:
              arguments:
                to: ref('int_latest_tmdb_resolutions')
                field: resolution_id
      - name: resolution_status
        description: "{{ doc('fct_current_broadcasts_resolution_status') }}"
        data_tests:
          - accepted_values:
              arguments: {values: [matched, unresolved]}
      - name: tmdb_id
        description: "{{ doc('fct_current_broadcasts_tmdb_id') }}"
      - name: media_type
        description: "{{ doc('fct_current_broadcasts_media_type') }}"
        data_tests:
          - accepted_values:
              arguments: {values: [movie, tv]}
      - name: source
        description: "{{ doc('fct_current_broadcasts_source') }}"
        data_tests: [not_null]
      - name: channel
        description: "{{ doc('fct_current_broadcasts_channel') }}"
        data_tests: [not_null]
      - name: schedule_date
        description: "{{ doc('fct_current_broadcasts_schedule_date') }}"
        data_tests: [not_null]
      - name: broadcast_date
        description: "{{ doc('fct_current_broadcasts_broadcast_date') }}"
        data_tests: [not_null]
      - name: title
        description: "{{ doc('fct_current_broadcasts_title') }}"
        data_tests:
          - not_null
          - dbt_utils.not_empty_string
      - name: starts_at
        description: "{{ doc('fct_current_broadcasts_starts_at') }}"
        data_tests: [not_null]
      - name: ends_at
        description: "{{ doc('fct_current_broadcasts_ends_at') }}"
      - name: starts_at_local
        description: "{{ doc('fct_current_broadcasts_starts_at_local') }}"
        data_tests: [not_null]
      - name: ends_at_local
        description: "{{ doc('fct_current_broadcasts_ends_at_local') }}"
      - name: duration_minutes
        description: "{{ doc('fct_current_broadcasts_duration_minutes') }}"
      - name: crosses_midnight
        description: "{{ doc('fct_current_broadcasts_crosses_midnight') }}"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: programme_position
        description: "{{ doc('fct_current_broadcasts_programme_position') }}"
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
      - name: description
        description: "{{ doc('fct_current_broadcasts_description') }}"
      - name: source_url
        description: "{{ doc('fct_current_broadcasts_source_url') }}"
        data_tests: [not_null]
      - name: retrieved_at
        description: "{{ doc('fct_current_broadcasts_retrieved_at') }}"
        data_tests: [not_null]
      - name: ingestion_completed_at
        description: "{{ doc('fct_current_broadcasts_ingestion_completed_at') }}"
        data_tests: [not_null]

  - name: mart_daily_channel_schedule
    description: "{{ doc('mart_daily_channel_schedule') }}"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [source, channel, schedule_date]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "programmes_with_known_duration <= programme_count"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "programmes_crossing_midnight <= programme_count"
    columns:
      - name: channel_key
        description: "{{ doc('mart_daily_channel_schedule_channel_key') }}"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_channels')
                field: channel_key
      - name: source
        description: "{{ doc('mart_daily_channel_schedule_source') }}"
        data_tests: [not_null]
      - name: channel
        description: "{{ doc('mart_daily_channel_schedule_channel') }}"
        data_tests: [not_null]
      - name: schedule_date
        description: "{{ doc('mart_daily_channel_schedule_schedule_date') }}"
        data_tests: [not_null]
      - name: programme_count
        description: "{{ doc('mart_daily_channel_schedule_programme_count') }}"
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
      - name: programmes_with_known_duration
        description: "{{ doc('mart_daily_channel_schedule_programmes_with_known_duration') }}"
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: known_scheduled_minutes
        description: "{{ doc('mart_daily_channel_schedule_known_scheduled_minutes') }}"
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: first_programme_starts_at_local
        description: "{{ doc('mart_daily_channel_schedule_first_programme_starts_at_local') }}"
        data_tests: [not_null]
      - name: last_programme_ends_at_local
        description: "{{ doc('mart_daily_channel_schedule_last_programme_ends_at_local') }}"
      - name: programmes_crossing_midnight
        description: "{{ doc('mart_daily_channel_schedule_programmes_crossing_midnight') }}"
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: ingestion_completed_at
        description: "{{ doc('mart_daily_channel_schedule_ingestion_completed_at') }}"
        data_tests: [not_null]

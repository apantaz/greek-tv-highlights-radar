[project]
name = "greek-tv-highlights-radar"
version = "0.4.0"
description = "A reproducible pipeline for collecting and exploring Greek TV schedules."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx",
  "beautifulsoup4",
  "duckdb",
  "pydantic",
  "python-dotenv",
  "pytz"
]

[project.optional-dependencies]
dev = [
  "commitizen",
  "dbt-core>=1.12,<1.13",
  "dbt-duckdb>=1.10,<1.11",
  "pre-commit",
  "pytest",
  "pytest-cov",
  "ruff"
]

[project.scripts]
greek-tv = "greek_tv.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/greek_tv"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["greek_tv"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"
force-exclude = true

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]
ignore = ["RUF001"]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "v$version"

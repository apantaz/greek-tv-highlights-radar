[project]
name = "greek-tv-highlights-radar"
version = "0.2.0"
description = "A reproducible pipeline for collecting and exploring Greek TV schedules."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx",
  "beautifulsoup4",
  "duckdb",
  "pydantic",
  "python-dotenv",
  "pytz"
]

[project.optional-dependencies]
dev = ["commitizen", "pre-commit", "pytest", "ruff"]

[project.scripts]
greek-tv = "greek_tv.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/greek_tv"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
force-exclude = true

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]
ignore = ["RUF001"]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "v$version"

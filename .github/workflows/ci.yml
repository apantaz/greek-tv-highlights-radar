name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest
      - name: Validate dbt foundation
        working-directory: dbt
        env:
          DBT_DUCKDB_PATH: /tmp/greek_tv_ci.duckdb
        run: |
          dbt deps
          dbt debug
          dbt parse
